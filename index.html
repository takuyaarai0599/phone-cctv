<h1>phone-cctv プライバシーポリシー</h1>
<p>phone-cctv は、所有者本人が自宅の監視カメラ映像を、自分の Google ドライブに保存するための個人用ツールです。</p>
<ul>
  <li>Google ドライブでは、このツール自身が作成したファイルにのみアクセスします（drive.file 権限）。</li>
  <li>映像は保存前に暗号化され、所有者以外の第三者に提供・共有されることはありません。</li>
  <li>所有者以外の利用者はいません。</li>
</ul>
